name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Скачать код
        uses: actions/checkout@v4

      - name: Собрать архив
        run: |
          xcodebuild clean archive \
            -project my.income \
            -scheme my.income \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/my.income.xcarchive

      - name: Экспортировать IPA
        run: |
          xcodebuild -exportArchive \
            -archivePath build/my.income.xcarchive \
            -exportPath build \
            -exportOptionsPlist exportOptions.plist

      - name: Сохранить IPA
        uses: actions/upload-artifact@v4
        with:
          name: my.income-ipa
          path: build/*.ipa
